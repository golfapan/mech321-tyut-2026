<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1120" width="1440" height="1120" role="img" aria-labelledby="map-title map-desc"><title id="map-title">Dynamics and control: a network centred on LTI systems</title><desc id="map-desc">LTI connects to continuous and discrete time, state space, transfer functions and control design. Nonlinear models connect through local linearisation; time-varying and hybrid models extend the assumptions. Classical feedback is the course core; optimal, state-based, robust and learning methods extend it. Links indicate relationships, not strict set inclusion.</desc><defs><marker id="arrow-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#5de0ce"/></marker><marker id="arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8fa9bd"/></marker><marker id="arrow-gold" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#ffbf69"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#edf6fc}.sub{fill:#b7ccdc}.edge-label{font-size:18px;fill:#b7ccdc;paint-order:stroke;stroke:#091727;stroke-width:7px;stroke-linejoin:round}.group-label{font-size:17px;font-weight:650;letter-spacing:1.8px;fill:#94aec4}.node-title{font-size:24px;font-weight:650}.node-sub{font-size:18px;fill:#b7ccdc}</style><rect width="1440" height="1120" rx="18" fill="#091727"/><rect x="390" y="72" width="1010" height="395" rx="26" fill="#102238" fill-opacity=".38" stroke="#294157" stroke-dasharray="6 8"/><text x="895.0" y="103" text-anchor="middle" font-size="20" class="group-label">SYSTEM MODELS &amp; TIME</text><rect x="28" y="344" width="370" height="340" rx="26" fill="#102238" fill-opacity=".38" stroke="#294157" stroke-dasharray="6 8"/><text x="213.0" y="375" text-anchor="middle" font-size="20" class="group-label">REPRESENTATIONS</text><rect x="28" y="722" width="1372" height="365" rx="26" fill="#102238" fill-opacity=".38" stroke="#294157" stroke-dasharray="6 8"/><text x="714.0" y="753" text-anchor="middle" font-size="20" class="group-label">CONTROL &amp; OPTIMISATION</text><text x="720" y="42" text-anchor="middle" font-size="27" font-weight="700">DYNAMICS &amp; CONTROL</text><path d="M650 450L642 405" fill="none" stroke="#5de0ce" stroke-width="2" marker-end="url(#arrow-teal)"/><path d="M795 450Q850 420 915 405" fill="none" stroke="#8fa9bd" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="779" y="432" text-anchor="middle" font-size="16">time domain</text><path d="M598 450Q445 355 575 260" fill="none" stroke="#8fa9bd" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-muted)"/><text x="478" y="299" text-anchor="middle" font-size="20" class="edge-label">vary A, B</text><path d="M1080 230H1063V490H870" fill="none" stroke="#ffbf69" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-gold)"/><text x="968" y="477" text-anchor="middle" font-size="20" class="edge-label">local linearisation</text><path d="M870 555Q1060 580 1217 450" fill="none" stroke="#8fa9bd" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-muted)"/><text x="1130" y="558" text-anchor="middle" font-size="20" class="edge-label">add model features</text><path d="M355 456L570 500" fill="none" stroke="#ffbf69" stroke-width="2" marker-end="url(#arrow-gold)"/><text x="450" y="457" text-anchor="middle" font-size="20" class="edge-label">represents</text><path d="M355 592L570 554" fill="none" stroke="#5de0ce" stroke-width="2" marker-end="url(#arrow-teal)"/><text x="449" y="612" text-anchor="middle" font-size="20" class="edge-label">zero-state path</text><path d="M585 590Q430 650 310 805" fill="none" stroke="#5de0ce" stroke-width="2" marker-end="url(#arrow-teal)"/><text x="410" y="704" text-anchor="middle" font-size="20" class="edge-label">design feedback</text><path d="M720 610V815" fill="none" stroke="#8fa9bd" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="720" y="704" text-anchor="middle" font-size="20" class="edge-label">add cost / constraints</text><path d="M870 584L935 690L1040 815" fill="none" stroke="#8fa9bd" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="1112" y="702" text-anchor="middle" font-size="20" class="edge-label">state-based design</text><path d="M935 690V1010H980" fill="none" stroke="#8fa9bd" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-muted)"/><path d="M605 915L535 975" fill="none" stroke="#8fa9bd" stroke-width="2" marker-end="url(#arrow-muted)"/><path d="M775 915L770 975" fill="none" stroke="#8fa9bd" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="557" y="437" width="326" height="186" rx="27" fill="none" stroke="#5de0ce" stroke-opacity=".3" stroke-width="2" stroke-dasharray="5 6"/><rect x="570" y="450" width="300" height="160" rx="20" fill="#104643" stroke="#5de0ce" stroke-width="3"/><text x="720" y="498" text-anchor="middle" font-size="42" font-weight="750">LTI</text><text x="720" y="533" text-anchor="middle" font-size="21">Linear + time invariant</text><text x="720" y="579" text-anchor="middle" font-size="16" style="fill:#5de0ce" font-weight="700">OUR SMALL FOUNDATION</text><rect x="440" y="155" width="270" height="105" rx="15" fill="#152b42" stroke="#8fa9bd" stroke-width="1.2"/><text x="575.0" y="188" text-anchor="middle" font-size="20" class="node-title">Linear time-varying</text><text x="575.0" y="219" text-anchor="middle" font-size="20" class="node-sub">A(t), B(t)</text><rect x="520" y="310" width="245" height="95" rx="15" fill="#103b3b" stroke="#5de0ce" stroke-width="2"/><text x="642.5" y="343" text-anchor="middle" font-size="20" class="node-title">Continuous-time</text><text x="642.5" y="374" text-anchor="middle" font-size="20" class="node-sub">ẋ = Ax + Bu</text><text x="642.5" y="392" text-anchor="middle" font-size="14" style="fill:#5de0ce" font-weight="600">COURSE FOCUS</text><rect x="800" y="310" width="245" height="95" rx="15" fill="#152b42" stroke="#8fa9bd" stroke-width="1.2"/><text x="922.5" y="343" text-anchor="middle" font-size="20" class="node-title">Discrete-time</text><text x="922.5" y="374" text-anchor="middle" font-size="20" class="node-sub">x[k+1] = Aᴅx[k] + Bᴅu[k]</text><rect x="1080" y="155" width="270" height="110" rx="15" fill="#152b42" stroke="#8fa9bd" stroke-width="1.2"/><text x="1215.0" y="188" text-anchor="middle" font-size="20" class="node-title">Nonlinear systems</text><text x="1215.0" y="219" text-anchor="middle" font-size="20" class="node-sub">ẋ = f(x,u,t)</text><text x="1215.0" y="244" text-anchor="middle" font-size="20" class="node-sub">large motion • nonlinear terms</text><rect x="1090" y="350" width="255" height="100" rx="15" fill="#152b42" stroke="#8fa9bd" stroke-width="1.2"/><text x="1217.5" y="383" text-anchor="middle" font-size="20" class="node-title">Hybrid • stochastic</text><text x="1217.5" y="412" text-anchor="middle" font-size="20" class="node-title">networked systems</text><text x="1217.5" y="443" text-anchor="middle" font-size="20" class="node-sub">events • noise • interactions</text><rect x="65" y="405" width="290" height="100" rx="15" fill="#152b42" stroke="#ffbf69" stroke-width="2"/><text x="210.0" y="438" text-anchor="middle" font-size="20" class="node-title">State space</text><text x="210.0" y="469" text-anchor="middle" font-size="20" class="node-sub">linear OR nonlinear</text><text x="210.0" y="492" text-anchor="middle" font-size="14" style="fill:#ffbf69" font-weight="600">INTRODUCED IN L6</text><rect x="65" y="545" width="290" height="95" rx="15" fill="#103b3b" stroke="#5de0ce" stroke-width="2"/><text x="210.0" y="578" text-anchor="middle" font-size="20" class="node-title">Transfer functions</text><text x="210.0" y="609" text-anchor="middle" font-size="20" class="node-sub">G(s) • poles • response</text><rect x="65" y="805" width="290" height="140" rx="15" fill="#103b3b" stroke="#5de0ce" stroke-width="2"/><text x="210.0" y="838" text-anchor="middle" font-size="20" class="node-title">Classical feedback</text><text x="210.0" y="869" text-anchor="middle" font-size="20" class="node-sub">tracking • disturbances</text><text x="210.0" y="894" text-anchor="middle" font-size="20" class="node-sub">Nyquist • margins</text><text x="210.0" y="932" text-anchor="middle" font-size="14" style="fill:#5de0ce" font-weight="600">OPTIONAL: ROOT LOCUS / PID</text><rect x="500" y="815" width="370" height="100" rx="15" fill="#152b42" stroke="#8fa9bd" stroke-width="1.2"/><text x="685.0" y="848" text-anchor="middle" font-size="20" class="node-title">Optimal control</text><text x="685.0" y="879" text-anchor="middle" font-size="20" class="node-sub">cost + dynamics + constraints</text><rect x="440" y="975" width="185" height="75" rx="15" fill="#152b42" stroke="#8fa9bd" stroke-width="1.2"/><text x="532.5" y="1008" text-anchor="middle" font-size="20" class="node-title">LQR</text><text x="532.5" y="1039" text-anchor="middle" font-size="20" class="node-sub">linear + quadratic</text><rect x="655" y="975" width="215" height="75" rx="15" fill="#152b42" stroke="#8fa9bd" stroke-width="1.2"/><text x="762.5" y="1008" text-anchor="middle" font-size="20" class="node-title">MPC</text><text x="762.5" y="1039" text-anchor="middle" font-size="20" class="node-sub">reoptimise • constraints</text><rect x="980" y="815" width="365" height="100" rx="15" fill="#152b42" stroke="#8fa9bd" stroke-width="1.2"/><text x="1162.5" y="848" text-anchor="middle" font-size="20" class="node-title">State feedback &amp; estimation</text><text x="1162.5" y="879" text-anchor="middle" font-size="20" class="node-sub">pole placement • observers</text><text x="1162.5" y="904" text-anchor="middle" font-size="20" class="node-sub">Kalman filter • LQG</text><rect x="980" y="970" width="365" height="80" rx="15" fill="#152b42" stroke="#8fa9bd" stroke-width="1.2"/><text x="1162.5" y="1003" text-anchor="middle" font-size="20" class="node-title">Robust • adaptive • learning</text><text x="1162.5" y="1034" text-anchor="middle" font-size="20" class="node-sub">H∞ • adaptation • RL • distributed</text><text x="295" y="662" text-anchor="middle" font-size="16" style="fill:#ffbf69">State space also describes discrete-time</text><text x="295" y="683" text-anchor="middle" font-size="16" style="fill:#ffbf69">and nonlinear models.</text><text x="720" y="655" text-anchor="middle" font-size="17" style="fill:#5de0ce">This course: continuous time • finite-dimensional • mainly SISO</text><circle cx="80" cy="1100" r="5" fill="#5de0ce"/><text x="94" y="1106" font-size="17">Course core</text><circle cx="300" cy="1100" r="5" fill="#ffbf69"/><text x="314" y="1106" font-size="17">Introduced</text><circle cx="525" cy="1100" r="5" fill="#8fa9bd"/><text x="539" y="1106" font-size="17">Further study</text><text x="1090" y="1106" text-anchor="middle" font-size="16" style="fill:#94aec4">Links show relationships, not strict subsets.</text><path d="M1350 210H1375V622H1345" fill="none" stroke="#8fa9bd" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="1090" y="570" width="255" height="105" rx="15" fill="#152b42" stroke="#8fa9bd" stroke-width="1.2"/><text x="1217.5" y="603" text-anchor="middle" class="node-title">Nonlinear control</text><text x="1217.5" y="634" text-anchor="middle" class="node-sub">Lyapunov design</text><text x="1217.5" y="659" text-anchor="middle" class="node-sub">energy shaping</text></svg>